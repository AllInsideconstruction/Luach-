<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meetings">
<title>Meeting Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#18213a; --muted:#5b6582; --line:#dde2ec;
  --tekhelet:#1f3f8f; --tekhelet-soft:#e4eaf8; --band:#142a61; --band-ink:#f2f5fc; --band-muted:#b7c3e4;
  --gold:#b0861e; --gold-soft:#f6eed8; --good:#2f7a4f; --good-soft:#e2f2e8; --rec:#c0392b; --rec-soft:#fbe7e4;
  --f-display:"Frank Ruhl Libre","Times New Roman",serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --ink:#e6eaf5; --muted:#99a3bf; --line:#283150;
  --tekhelet:#8eaaf2; --tekhelet-soft:#1e2a4c; --band:#0a1838; --band-ink:#eef2fc; --band-muted:#a2b0d6;
  --gold:#e0b850; --gold-soft:#2f2914; --good:#6fcf97; --good-soft:#163024; --rec:#ff7a6b; --rec-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --ink:#e6eaf5; --muted:#99a3bf; --line:#283150;
  --tekhelet:#8eaaf2; --tekhelet-soft:#1e2a4c; --band:#0a1838; --band-ink:#eef2fc; --band-muted:#a2b0d6;
  --gold:#e0b850; --gold-soft:#2f2914; --good:#6fcf97; --good-soft:#163024; --rec:#ff7a6b; --rec-soft:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);margin:0;font-weight:700;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;cursor:pointer}
.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.band .wrap{padding-block:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.band h1{font-size:24px}
.band a{color:var(--band-muted);text-decoration:none;font-size:14px}
.band a:hover{color:var(--band-ink)}
main{display:flex;flex-direction:column;gap:16px;padding-block:18px 40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.phead h2{font-size:21px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
label.lb{display:block;margin-bottom:4px}
.btn{border:1px solid var(--tekhelet);background:var(--tekhelet);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--tekhelet)}
.btn.danger{background:transparent;border-color:var(--rec);color:var(--rec)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.recbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* recorder */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.clock{font-size:44px;font-weight:600;letter-spacing:.02em}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.rec .dot{background:var(--rec);animation:pulse 1.2s infinite}
.paused .dot{background:var(--gold)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
.meter{width:100%;max-width:360px;height:8px;border-radius:4px;background:var(--tekhelet-soft);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .08s linear}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.recbtn{width:76px;height:76px;border-radius:50%;border:4px solid var(--rec);background:var(--surface);display:grid;place-items:center;padding:0}
.recbtn span{display:block;width:52px;height:52px;border-radius:50%;background:var(--rec);transition:all .15s}
.recbtn.on span{width:28px;height:28px;border-radius:6px}
.side{min-width:96px}
.opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:14px}
.opts label{display:inline-flex;gap:6px;align-items:center}
.opts input{width:auto}
.live{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;min-height:48px;max-height:200px;overflow:auto;font-size:14px;white-space:pre-wrap}
.live .interim{color:var(--muted)}
.marks{display:flex;flex-direction:column;gap:4px;font-size:14px}
.marks div{display:flex;gap:8px}
.marks b{color:var(--gold);min-width:52px}
.markrow{display:flex;gap:8px}
.markrow input{flex:1}
.err{background:var(--rec-soft);color:var(--rec);border-radius:8px;padding:10px 12px;font-size:14px}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.item h3{margin:0;font-size:17px;font-family:var(--f-body);font-weight:700;overflow-wrap:anywhere}
.item audio{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{padding:6px 11px;font-size:14px}
details summary{cursor:pointer;color:var(--tekhelet);font-weight:600;font-size:14px}
details .body{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.search{max-width:260px}
.storage{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1>Meeting Recorder</h1>
    <a href="./">‹ Back to Luach</a>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-labelledby="newH">
    <div class="phead"><h2 id="newH">New recording</h2><span class="hint">Saved on this phone only</span></div>
    <div>
      <label class="lb label" for="title">Meeting name</label>
      <input id="title" maxlength="120" placeholder="e.g. Site meeting – Cohen extension" autocomplete="off">
    </div>

    <div class="stage" id="stage">
      <div class="state" id="state"><span class="dot"></span><span id="stateTxt">Ready</span></div>
      <div class="clock num" id="clock" aria-live="off">00:00</div>
      <div class="meter" aria-hidden="true"><i id="level"></i></div>
      <div class="controls">
        <button type="button" class="btn ghost side" id="pauseBtn" disabled>Pause</button>
        <button type="button" class="recbtn" id="recBtn" aria-label="Start recording"><span></span></button>
        <button type="button" class="btn ghost side" id="discardBtn" disabled>Discard</button>
      </div>
      <div class="opts">
        <label id="trOpt"><input type="checkbox" id="doTranscript" checked> Live transcript</label>
        <label><input type="checkbox" id="keepAwake" checked> Keep screen on</label>
      </div>
      <p class="hint" id="tip" style="margin:0;text-align:center">Tap the red button to start. Keep this page open while recording.</p>
    </div>

    <div id="errBox" class="err" hidden role="alert"></div>

    <div id="trWrap">
      <div class="label" style="margin-bottom:4px">Live transcript</div>
      <div class="live" id="live" aria-live="polite"><span class="hint">The words will appear here while you record.</span></div>
    </div>

    <div>
      <div class="label" style="margin-bottom:4px">Bookmarks</div>
      <form class="markrow" id="markForm" autocomplete="off">
        <label for="markTxt" class="sr">Bookmark note</label>
        <input id="markTxt" placeholder="Note a key moment (e.g. price agreed)" maxlength="200">
        <button class="btn ghost" type="submit" id="markBtn" disabled>Mark</button>
      </form>
      <div class="marks" id="marks"></div>
    </div>

    <div>
      <label class="lb label" for="notes">Notes</label>
      <textarea id="notes" placeholder="Who was there, decisions, actions…"></textarea>
    </div>
  </section>

  <section class="panel" aria-labelledby="listH">
    <div class="phead"><h2 id="listH">Saved meetings</h2>
      <label for="q" class="sr">Search</label><input id="q" class="search" type="search" placeholder="Search meetings">
    </div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
    <div class="storage" id="storage"></div>
  </section>
</main>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,"0");return (h?h+":"+p(m):p(m))+":"+p(x)};

/* ---------- IndexedDB ---------- */
let dbp=null;
function idb(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    const r=indexedDB.open("meeting-recorder",1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("meetings"))d.createObjectStore("meetings",{keyPath:"id"});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("meetings",mode);const s=t.objectStore("meetings");let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const dbAll=()=>tx("readonly",s=>s.getAll());
const dbPut=m=>tx("readwrite",s=>s.put(m));
const dbDel=id=>tx("readwrite",s=>s.delete(id));

/* ---------- recorder state ---------- */
const MIMES=["audio/webm;codecs=opus","audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm","audio/ogg;codecs=opus"];
let stream=null,rec=null,chunks=[],mime="",startAt=0,pausedTotal=0,pauseAt=0,tick=null;
let actx=null,analyser=null,raf=null,wake=null,recog=null,recogWanted=false;
let finalText="",interim="",marks=[],startedIso="";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("doTranscript").checked=false;$("trOpt").hidden=true;$("trWrap").hidden=true;}

const elapsed=()=>!startAt?0:(pauseAt||Date.now())-startAt-pausedTotal;
function setState(kind,txt){$("stage").className="stage "+kind;$("stateTxt").textContent=txt;}
function showErr(msg){const b=$("errBox");b.textContent=msg;b.hidden=!msg;}

async function start(){
  showErr("");
  if(!navigator.mediaDevices||!window.MediaRecorder){showErr("This browser can't record audio. Open the app in Safari (iPhone) or Chrome (Android), from the https web address.");return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){showErr(e&&e.name==="NotAllowedError"?"Microphone permission was refused. Allow the microphone for this site in your phone's settings and try again.":"Couldn't start the microphone: "+(e&&e.message||e));return;}
  mime=MIMES.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:64000}:undefined);}catch(_){rec=new MediaRecorder(stream);}
  mime=rec.mimeType||mime||"audio/webm";
  chunks=[];finalText="";interim="";marks=[];renderMarks();renderLive();
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.start(1000);
  startAt=Date.now();pausedTotal=0;pauseAt=0;startedIso=new Date().toISOString();
  tick=setInterval(()=>{$("clock").textContent=fmt(elapsed())},250);
  meter();
  if($("keepAwake").checked) awake(true);
  if(SR&&$("doTranscript").checked) startRecog();
  $("recBtn").classList.add("on");$("recBtn").setAttribute("aria-label","Stop and save");
  $("pauseBtn").disabled=false;$("discardBtn").disabled=false;$("markBtn").disabled=false;
  $("doTranscript").disabled=true;
  $("tip").textContent="Recording. Tap the square to stop and save.";
  setState("rec","Recording");
}

function pause(){
  if(!rec)return;
  if(rec.state==="recording"){rec.pause();pauseAt=Date.now();stopRecog();setState("paused","Paused");$("pauseBtn").textContent="Resume";}
  else if(rec.state==="paused"){rec.resume();pausedTotal+=Date.now()-pauseAt;pauseAt=0;if(SR&&$("doTranscript").checked)startRecog();setState("rec","Recording");$("pauseBtn").textContent="Pause";}
}

function finish(){
  return new Promise(res=>{
    if(!rec||rec.state==="inactive"){res();return;}
    rec.onstop=()=>res();
    try{rec.requestData()}catch(_){}
    rec.stop();
  });
}

function cleanup(){
  clearInterval(tick);tick=null;cancelAnimationFrame(raf);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(actx)actx.close().catch(()=>{});
  stopRecog();awake(false);
  stream=null;rec=null;actx=null;analyser=null;startAt=0;pauseAt=0;
  $("level").style.width="0";
  $("recBtn").classList.remove("on");$("recBtn").setAttribute("aria-label","Start recording");
  $("pauseBtn").disabled=true;$("pauseBtn").textContent="Pause";$("discardBtn").disabled=true;$("markBtn").disabled=true;
  $("doTranscript").disabled=false;
  $("clock").textContent="00:00";
  $("tip").textContent="Tap the red button to start. Keep this page open while recording.";
  setState("","Ready");
}

async function stopAndSave(){
  const dur=elapsed();
  $("recBtn").disabled=true;setState("","Saving…");
  await finish();
  const blob=new Blob(chunks,{type:mime});
  const t=$("title").value.trim();
  const when=new Date(startedIso);
  const m={
    id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title:t||("Meeting "+when.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+when.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})),
    started:startedIso,duration:dur,mime,blob,
    transcript:(finalText+" "+interim).trim(),
    notes:$("notes").value.trim(),marks:marks.slice()
  };
  cleanup();
  try{await dbPut(m);$("title").value="";$("notes").value="";finalText="";interim="";marks=[];renderMarks();renderLive();}
  catch(e){
    showErr("Couldn't save to the phone's storage, so the recording is being downloaded instead.");
    download(blob,fileName(m,ext(mime)));
  }
  $("recBtn").disabled=false;
  load();
}

async function discard(){
  if(!confirm("Discard this recording? It won't be saved."))return;
  await finish();chunks=[];cleanup();finalText="";interim="";marks=[];renderMarks();renderLive();
}

$("recBtn").onclick=()=>{rec?stopAndSave():start()};
$("pauseBtn").onclick=pause;
$("discardBtn").onclick=discard;
window.addEventListener("beforeunload",e=>{if(rec){e.preventDefault();e.returnValue="";}});

/* level meter */
function meter(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
    const src=actx.createMediaStreamSource(stream);analyser=actx.createAnalyser();analyser.fftSize=512;src.connect(analyser);
    const buf=new Uint8Array(analyser.fftSize);
    const loop=()=>{if(!analyser)return;analyser.getByteTimeDomainData(buf);let sum=0;for(const v of buf){const d=(v-128)/128;sum+=d*d}const rms=Math.sqrt(sum/buf.length);
      $("level").style.width=(rec&&rec.state==="recording"?Math.min(100,rms*350):0)+"%";raf=requestAnimationFrame(loop)};
    loop();
  }catch(_){}
}

/* wake lock */
async function awake(on){
  try{
    if(on&&"wakeLock" in navigator){wake=await navigator.wakeLock.request("screen");}
    else if(!on&&wake){await wake.release();wake=null;}
  }catch(_){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&rec&&$("keepAwake").checked)awake(true)});

/* live transcript */
function startRecog(){
  if(!SR)return;recogWanted=true;
  if(recog)return;
  recog=new SR();recog.continuous=true;recog.interimResults=true;recog.lang=navigator.language||"en-GB";
  recog.onresult=e=>{
    interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=(finalText?" ":"")+r[0].transcript.trim();else interim+=r[0].transcript;}
    renderLive();
  };
  recog.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){recogWanted=false;$("live").innerHTML='<span class="hint">Live transcript isn\'t allowed on this device. The audio is still recording.</span>';}};
  recog.onend=()=>{recog=null;if(interim){finalText+=(finalText?" ":"")+interim.trim();interim="";}if(recogWanted&&rec&&rec.state==="recording")setTimeout(startRecog,250);};
  try{recog.start()}catch(_){recog=null}
}
function stopRecog(){recogWanted=false;if(recog){try{recog.stop()}catch(_){}}}
function renderLive(){
  const el=$("live");
  if(!finalText&&!interim){el.innerHTML='<span class="hint">The words will appear here while you record.</span>';return;}
  el.innerHTML=esc(finalText)+(interim?' <span class="interim">'+esc(interim)+'</span>':"");
  el.scrollTop=el.scrollHeight;
}

/* bookmarks */
$("markForm").onsubmit=e=>{e.preventDefault();if(!rec)return;marks.push({t:elapsed(),text:$("markTxt").value.trim()||"Bookmark"});$("markTxt").value="";renderMarks();};
function renderMarks(){$("marks").innerHTML=marks.map(m=>`<div><b class="num">${fmt(m.t)}</b><span>${esc(m.text)}</span></div>`).join("");}

/* ---------- saved list ---------- */
let all=[];const urls=new Map();
const ext=m=>/mp4|aac|m4a/.test(m)?"m4a":/ogg/.test(m)?"ogg":"webm";
const fileName=(m,x)=>(m.title.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"meeting")+"-"+m.started.slice(0,10)+"."+x;
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function textOf(m){
  const d=new Date(m.started);
  let s=`${m.title}\n${d.toLocaleString("en-GB",{dateStyle:"full",timeStyle:"short"})}\nLength: ${fmt(m.duration)}\n`;
  if(m.notes)s+=`\nNOTES\n${m.notes}\n`;
  if(m.marks&&m.marks.length)s+=`\nBOOKMARKS\n${m.marks.map(k=>fmt(k.t)+"  "+k.text).join("\n")}\n`;
  if(m.transcript)s+=`\nTRANSCRIPT (automatic, may contain mistakes)\n${m.transcript}\n`;
  return s;
}

async function load(){
  try{all=(await dbAll()).sort((a,b)=>b.started.localeCompare(a.started));}
  catch(e){$("list").innerHTML='<div class="empty">Couldn\'t open this phone\'s storage. Private browsing may block it.</div>';return;}
  render();storage();
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const rows=q?all.filter(m=>(m.title+" "+m.notes+" "+m.transcript+" "+(m.marks||[]).map(k=>k.text).join(" ")).toLowerCase().includes(q)):all;
  for(const [id,u] of urls){if(!all.some(m=>m.id===id)){URL.revokeObjectURL(u);urls.delete(id);}}
  if(!rows.length){$("list").innerHTML=`<div class="empty">${all.length?"No meetings match that search.":"No meetings recorded yet. Your recordings will be listed here."}</div>`;return;}
  $("list").innerHTML=rows.map(m=>{
    if(!urls.has(m.id))urls.set(m.id,URL.createObjectURL(m.blob));
    const d=new Date(m.started);
    const mk=(m.marks||[]).map((k,i)=>`<div><button type="button" class="btn ghost" style="padding:1px 8px;font-size:13px" data-seek="${m.id}" data-t="${k.t}">${fmt(k.t)}</button> <span>${esc(k.text)}</span></div>`).join("");
    return `<article class="item" data-id="${m.id}">
      <div class="top"><h3>${esc(m.title)}</h3><span class="hint num">${esc(d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}))} · ${esc(d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}))} · ${fmt(m.duration)} · ${(m.blob.size/1048576).toFixed(1)} MB</span></div>
      <audio controls preload="metadata" src="${urls.get(m.id)}" id="a-${m.id}"></audio>
      ${mk?`<div class="marks">${mk}</div>`:""}
      <details><summary>Notes &amp; transcript</summary><div class="body">
        <label class="label" for="n-${m.id}">Notes</label><textarea id="n-${m.id}" data-notes="${m.id}">${esc(m.notes)}</textarea>
        ${m.transcript?`<div class="label">Transcript</div><div class="live" style="max-height:300px">${esc(m.transcript)}</div>`:`<div class="hint">No transcript for this meeting.</div>`}
      </div></details>
      <div class="acts">
        <button type="button" class="btn ghost" data-act="audio">Download audio</button>
        <button type="button" class="btn ghost" data-act="text">Download notes</button>
        ${navigator.share?`<button type="button" class="btn ghost" data-act="share">Share</button>`:""}
        <button type="button" class="btn ghost" data-act="rename">Rename</button>
        <button type="button" class="btn danger" data-act="delete">Delete</button>
      </div>
    </article>`;
  }).join("");
}
$("q").addEventListener("input",render);

$("list").addEventListener("click",async e=>{
  const sk=e.target.closest("[data-seek]");
  if(sk){const a=$("a-"+sk.dataset.seek);a.currentTime=+sk.dataset.t/1000;a.play().catch(()=>{});return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.closest(".item").dataset.id;const m=all.find(x=>x.id===id);if(!m)return;
  const act=b.dataset.act;
  if(act==="audio")download(m.blob,fileName(m,ext(m.mime)));
  else if(act==="text")download(new Blob([textOf(m)],{type:"text/plain"}),fileName(m,"txt"));
  else if(act==="share"){
    const f=new File([m.blob],fileName(m,ext(m.mime)),{type:m.mime.split(";")[0]});
    const data={title:m.title,text:textOf(m)};
    try{if(navigator.canShare&&navigator.canShare({files:[f]}))data.files=[f];await navigator.share(data);}catch(_){}
  }
  else if(act==="rename"){const t=prompt("Meeting name",m.title);if(t&&t.trim()){m.title=t.trim().slice(0,120);await dbPut(m);render();}}
  else if(act==="delete"){if(confirm(`Delete "${m.title}"? This can't be undone.`)){await dbDel(id);all=all.filter(x=>x.id!==id);render();storage();}}
});
let saveT=null;
$("list").addEventListener("input",e=>{
  const ta=e.target.closest("[data-notes]");if(!ta)return;
  const m=all.find(x=>x.id===ta.dataset.notes);if(!m)return;m.notes=ta.value;
  clearTimeout(saveT);saveT=setTimeout(()=>dbPut(m).catch(()=>{}),600);
});

async function storage(){
  const total=all.reduce((s,m)=>s+(m.blob?m.blob.size:0),0);
  let t=`${all.length} meeting${all.length===1?"":"s"} · ${(total/1048576).toFixed(1)} MB used.`;
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.quota)t+=` About ${Math.max(0,(e.quota-e.usage)/1073741824).toFixed(1)} GB free for this app.`;}}catch(_){}
  t+=" Download anything important — clearing the browser's site data deletes recordings.";
  $("storage").textContent=t;
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
load();
})();
</script>
